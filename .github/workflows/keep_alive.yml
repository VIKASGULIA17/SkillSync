name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier instance from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-backend:
    name: Ping Render Backend Service
    runs-on: ubuntu-latest
    steps:
      - name: Ping SkillSync API
        run: |
          echo "Pinging SkillSync backend at https://skillsync-2ltw.onrender.com/ ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://skillsync-2ltw.onrender.com/)
          echo "Received HTTP Status Code: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
            echo "✅ Backend is active and healthy!"
          else
            echo "⚠️ Backend ping returned status ${HTTP_STATUS}"
          fi
